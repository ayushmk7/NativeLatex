<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>LibreWeave app icon, dark, small</title>
  <!-- macOS icon grid: one 824 px silhouette, 100 px inset, 185 px corner radius. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0A0A0A"/>
  <rect x="192" y="320" width="640" height="128" rx="64" fill="#FFFFFF"/>
  <rect x="192" y="576" width="640" height="128" rx="64" fill="#FFFFFF"/>
  <rect x="256" y="320" width="256" height="128" shape-rendering="crispEdges" fill="#0A0A0A"/>
  <rect x="512" y="576" width="256" height="128" shape-rendering="crispEdges" fill="#0A0A0A"/>
  <rect x="320" y="192" width="128" height="640" rx="64" fill="#4169E1"/>
  <rect x="576" y="192" width="128" height="640" rx="64" fill="#4169E1"/>
  <rect x="320" y="512" width="128" height="256" shape-rendering="crispEdges" fill="#0A0A0A"/>
  <rect x="320" y="576" width="128" height="128" shape-rendering="crispEdges" fill="#FFFFFF"/>
  <rect x="576" y="256" width="128" height="256" shape-rendering="crispEdges" fill="#0A0A0A"/>
  <rect x="576" y="320" width="128" height="128" shape-rendering="crispEdges" fill="#FFFFFF"/>
</svg>
